name: Verify packaged updater
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v0.1.3
# 초안 릴리즈 조회에는 GitHub의 push 접근 권한이 필요하다.
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.1 psutil==7.2.2 filelock==4.0.1 requests==2.34.2
      - name: Download signed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: gh release download "$RELEASE_TAG" --dir verify-assets --pattern latest.json --pattern "*-$TARGET_PLATFORM.tar.gz"
      - run: python scripts/verify_release_install.py verify-assets
